apiVersion: v1
kind: Service
metadata:
  name: hermes-agent
  namespace: devops-agent
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: devops-agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hermes-agent
  ports:
    - name: api
      port: 8642
      targetPort: api
    - name: dashboard
      port: 9119
      targetPort: dashboard
    - name: bedrock-bridge
      port: 18182
      targetPort: bedrock-bridge
