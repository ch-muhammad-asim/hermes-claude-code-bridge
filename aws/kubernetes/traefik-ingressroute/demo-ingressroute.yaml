###############################################################################
# End-to-end proof for Traefik on EKS
#
# Uses Traefik's own IngressRoute CRD rather than a plain Ingress, because that
# is where Traefik's routing model actually lives - middlewares, priorities and
# per-route TLS options have no Ingress equivalent.
###############################################################################
apiVersion: v1
kind: Namespace
metadata:
  name: traefik-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: traefik-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.4
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: whoami
  namespace: traefik-demo
spec:
  selector:
    app: whoami
  ports:
    - name: http
      port: 80
      targetPort: http
---
###############################################################################
# A middleware, to prove the CRD provider is doing more than plain routing.
###############################################################################
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: demo-headers
  namespace: traefik-demo
spec:
  headers:
    customResponseHeaders:
      X-Served-By: traefik-eks
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: whoami
  namespace: traefik-demo
  annotations:
    # Required. eks-values.yaml sets providers.kubernetesCRD.ingressClass, which
    # makes Traefik ignore every IngressRoute that does not carry a matching
    # class annotation. Without this the route is silently dropped and the NLB
    # answers 404 - healthy targets, no router.
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - web
  routes:
    - match: PathPrefix(`/whoami`)
      kind: Rule
      middlewares:
        - name: demo-headers
      services:
        - name: whoami
          port: 80
