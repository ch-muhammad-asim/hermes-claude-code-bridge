apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The load generator is applied separately so the app and HPA can settle first.
resources:
  - 00-namespace.yaml
  - 10-app.yaml
  - 20-hpa.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: load-testing
