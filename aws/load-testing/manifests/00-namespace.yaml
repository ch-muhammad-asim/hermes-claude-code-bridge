apiVersion: v1
kind: Namespace
metadata:
  name: load-testing
  labels:
    name: load-testing
    # Enforce the restricted Pod Security Standard - the workloads below are
    # written to satisfy it, so a privileged pod cannot sneak in later.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
###############################################################################
# A ResourceQuota is the safety net for a load test. Without one, a runaway HPA
# provisions capacity until it hits an AWS quota - an expensive way to find out
# the test was misconfigured.
#
# Sized to match the HPA ceiling in 20-hpa.yaml: 6 app pods x 250m plus the
# load generator. If you raise one, raise the other - and re-check the instance
# arithmetic in that file, because the binding sandbox limit is instance COUNT,
# not total CPU.
###############################################################################
apiVersion: v1
kind: ResourceQuota
metadata:
  name: load-testing
  namespace: load-testing
spec:
  hard:
    requests.cpu: "2500m"
    requests.memory: 2Gi
    limits.cpu: "5"
    limits.memory: 4Gi
    count/deployments.apps: "5"
