# Template only. Never apply this file as-is and never commit real values.
# ./generate.sh renders it with envsubst and applies the result.
#
# Required variables:
#   INITIAL_PASSWORD  JWT_SECRET  API_KEY_SECRET  MACHINE_ID_SALT
#   API_SERVER_KEY    HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH
#   HERMES_DASHBOARD_BASIC_AUTH_SECRET  NINEROUTER_API_KEY
#
# The dashboard hash is scrypt and must be produced by the SAME Hermes image the
# StatefulSet runs — see ./generate.sh.
#
# Unlike Compose, kubectl/envsubst do not reinterpret `$` in a value, so the
# hash goes in here verbatim with single `$` — no `$$` doubling.
apiVersion: v1
kind: Secret
metadata:
  name: 9router-secrets
  namespace: 9router
  labels:
    app.kubernetes.io/name: 9router
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: 9router
type: Opaque
stringData:
  INITIAL_PASSWORD: "${INITIAL_PASSWORD}"
  JWT_SECRET: "${JWT_SECRET}"
  API_KEY_SECRET: "${API_KEY_SECRET}"
  MACHINE_ID_SALT: "${MACHINE_ID_SALT}"
---
apiVersion: v1
kind: Secret
metadata:
  name: hermes-secrets
  namespace: 9router
  labels:
    app.kubernetes.io/name: hermes
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: 9router
type: Opaque
stringData:
  API_SERVER_KEY: "${API_SERVER_KEY}"
  HERMES_DASHBOARD_BASIC_AUTH_USERNAME: admin
  HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH: "${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH}"
  HERMES_DASHBOARD_BASIC_AUTH_SECRET: "${HERMES_DASHBOARD_BASIC_AUTH_SECRET}"
  # Named OPENAI_API_KEY because config.yaml's provider entry says
  # key_env: OPENAI_API_KEY. This is a 9Router key, not an OpenAI one.
  OPENAI_API_KEY: "${NINEROUTER_API_KEY}"
