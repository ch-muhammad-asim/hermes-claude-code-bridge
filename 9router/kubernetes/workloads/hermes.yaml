apiVersion: v1
kind: Service
metadata:
  name: hermes
  namespace: 9router
  labels:
    app.kubernetes.io/name: hermes
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: 9router
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hermes
  ports:
    - name: api
      port: 8642
      targetPort: api
    - name: dashboard
      port: 9119
      targetPort: dashboard
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes
  namespace: 9router
  labels:
    app.kubernetes.io/name: hermes
    app.kubernetes.io/component: agent
    app.kubernetes.io/part-of: 9router
spec:
  serviceName: hermes
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes
        app.kubernetes.io/component: agent
        app.kubernetes.io/part-of: 9router
    spec:
      terminationGracePeriodSeconds: 30
      volumes:
        - name: config-seed
          configMap:
            name: hermes-config
      initContainers:
        # Hermes REWRITES config.yaml at runtime (the dashboard's Config page
        # saves to it), so it cannot live on a read-only ConfigMap mount. Seed
        # it into the writable PVC on first start and leave it alone after.
        - name: seed-config
          image: nousresearch/hermes-agent:v2026.8.13
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              if [ -s /opt/data/config.yaml ]; then
                echo "config.yaml already present — leaving it untouched"
              else
                cp /seed/config.yaml /opt/data/config.yaml
                echo "seeded config.yaml from ConfigMap"
              fi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: config-seed
              mountPath: /seed
              readOnly: true
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:v2026.8.13
          imagePullPolicy: IfNotPresent
          args: ["gateway", "run"]
          ports:
            - name: api
              containerPort: 8642
            - name: dashboard
              containerPort: 9119
          env:
            - name: HERMES_HOME
              value: /opt/data
            - name: HERMES_SKILLS_DIR
              value: /opt/data/skills
            - name: HERMES_MEMORY_DIR
              value: /opt/data/memory
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: 0.0.0.0
            - name: API_SERVER_PORT
              value: "8642"
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_HOST
              value: 0.0.0.0
            - name: HERMES_DASHBOARD_PORT
              value: "9119"
            - name: HERMES_DASHBOARD_BASIC_AUTH_TTL_SECONDS
              value: "43200"
            - name: GATEWAY_ALLOW_ALL_USERS
              value: "true"
          # API_SERVER_KEY, HERMES_DASHBOARD_BASIC_AUTH_* and OPENAI_API_KEY all
          # come from here. Every one of them is load-bearing:
          #   no dashboard hash  -> Hermes refuses to bind 0.0.0.0 and crash-loops
          #   no API_SERVER_KEY  -> the API server never binds, readiness never passes
          #   no OPENAI_API_KEY  -> 9Router 401s every model call
          envFrom:
            - secretRef:
                name: hermes-secrets
          volumeMounts:
            - name: data
              mountPath: /opt/data
          readinessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 4Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
