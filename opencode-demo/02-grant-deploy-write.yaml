# Gate 1 (RBAC): grant the hermes-agent ServiceAccount write on Deployments so the
# agent can fix them. This is ADDITIVE — it does not modify the base read-only
# ClusterRole, so revoking is just `kubectl delete -f 02-grant-deploy-write.yaml`.
# Narrow on purpose: deployments only, no secrets, no delete, no other resources.
#
# Named hermes-opencode-demo-deploy-writer — distinct from the Claude demo's
# hermes-demo-deploy-writer, because ClusterRoles are cluster-scoped and reusing a name
# would mean one demo's apply/revoke silently rewriting the other's grant.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hermes-opencode-demo-deploy-writer
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: opencode-devops-demo
    app.kubernetes.io/part-of: opencode-devops-demo
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "update", "patch"]
  # `kubectl rollout status` watches the Deployment and its ReplicaSets; reads on
  # replicasets already come from the base read-only ClusterRole, so nothing extra is
  # granted here. No "delete", no "create", no "scale" subresource — the fix is an
  # in-place image change and nothing more.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hermes-opencode-demo-deploy-writer
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: opencode-devops-demo
    app.kubernetes.io/part-of: opencode-devops-demo
subjects:
  - kind: ServiceAccount
    name: hermes-agent
    namespace: devops-agent
roleRef:
  kind: ClusterRole
  name: hermes-opencode-demo-deploy-writer
  apiGroup: rbac.authorization.k8s.io
