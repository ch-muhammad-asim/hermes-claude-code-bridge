apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hermes-agent-dashboard
  namespace: devops-agent
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: devops-agent
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  entryPoints:
    - websecure
  tls: {}
  routes:
    - match: Host(`hermes.example.com`) && PathPrefix(`/v1`)
      kind: Rule
      services:
        - name: hermes-agent
          namespace: devops-agent
          port: 8642
    - match: Host(`hermes.example.com`) && PathPrefix(`/health`)
      kind: Rule
      services:
        - name: hermes-agent
          namespace: devops-agent
          port: 8642
    - match: Host(`hermes.example.com`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: hermes-agent
          namespace: devops-agent
          port: 9119
