apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes-agent
  namespace: devops-agent
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: runtime
    app.kubernetes.io/part-of: devops-agent
spec:
  serviceName: hermes-agent
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-agent
        app.kubernetes.io/component: runtime
        app.kubernetes.io/part-of: devops-agent
    spec:
      serviceAccountName: hermes-agent
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 10000
      volumes:
        - name: vertex-bridge-files
          configMap:
            name: hermes-agent-vertex-bridge
            defaultMode: 0755
        - name: gcp-mcp-auth-bridge-files
          configMap:
            name: hermes-agent-gcp-mcp-auth-bridge
            defaultMode: 0755
        - name: runtime-identity
          configMap:
            name: hermes-agent-runtime-identity
            defaultMode: 0644
        - name: lead-devops-sre-skill
          configMap:
            name: hermes-agent-lead-devops-sre-skill
            defaultMode: 0644
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi

        - name: claude-code-files
          configMap:
            name: hermes-agent-claude-code
            defaultMode: 0755
        - name: claude-cli
          emptyDir: {}
        - name: claude-tmp
          emptyDir: {}
      initContainers:
        - name: init-runtime-tools
          image: nousresearch/hermes-agent:v2026.9.7@sha256:63bfb6d732f49a55d453e801057273785cc61e0f6ee43db3fa2f2a79846301b7
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          env:
            - name: KUBECTL_STABLE_URL
              value: https://dl.k8s.io/release/stable.txt
            - name: KUBECTL_DEST
              value: /opt/data/bin/kubectl

            - name: GH_RELEASES_API
              value: https://api.github.com/repos/cli/cli/releases/latest
            - name: GH_DEST
              value: /opt/data/gh/bin/gh
          args:
            - |
              set -eu
              mkdir -p /opt/data/bin "$(dirname "$GH_DEST")"
              install_kubectl() {
                local kubectl_version have tmp_kubectl
                kubectl_version="$(curl -fsSL --retry 3 --retry-delay 2 "$KUBECTL_STABLE_URL")"
                case "$kubectl_version" in
                  v*) ;;
                  *) echo "Unexpected kubectl stable version: $kubectl_version" >&2; return 1 ;;
                esac
                have="$("$KUBECTL_DEST" version --client=true 2>/dev/null | sed -n 's/^Client Version: //p' || true)"
                if [ "$have" = "$kubectl_version" ]; then
                  echo "kubectl $have already latest — skipping download"
                  return 0
                fi
                tmp_kubectl="${KUBECTL_DEST}.tmp.$$"
                curl -fsSL --retry 3 --retry-delay 2 -o "$tmp_kubectl" \
                  "https://dl.k8s.io/release/${kubectl_version}/bin/linux/amd64/kubectl"
                chmod 0755 "$tmp_kubectl"
                "$tmp_kubectl" version --client=true 2>/dev/null | head -1
                mv -f "$tmp_kubectl" "$KUBECTL_DEST"
              }

              install_gh() {
                local gh_tag gh_ver have tmp_dir gh_tgz gh_base
                gh_tag="$(curl -fsSL --retry 3 --retry-delay 2 "$GH_RELEASES_API" \
                  | python3 -c 'import sys, json; print(json.load(sys.stdin)["tag_name"])')"
                case "$gh_tag" in
                  v*) ;;
                  *) echo "Unexpected gh release tag: $gh_tag" >&2; return 1 ;;
                esac
                gh_ver="${gh_tag#v}"
                have="$("$GH_DEST" --version 2>/dev/null | awk 'NR==1{print $3}' || true)"
                if [ "$have" = "$gh_ver" ]; then
                  echo "gh $have already latest — skipping download"
                  return 0
                fi
                tmp_dir="$(mktemp -d)"
                gh_tgz="gh_${gh_ver}_linux_amd64.tar.gz"
                gh_base="https://github.com/cli/cli/releases/download/${gh_tag}"
                curl -fsSL --retry 3 --retry-delay 2 -o "$tmp_dir/$gh_tgz" "$gh_base/$gh_tgz"
                curl -fsSL --retry 3 --retry-delay 2 -o "$tmp_dir/checksums.txt" \
                  "$gh_base/gh_${gh_ver}_checksums.txt"
                ( cd "$tmp_dir" && grep " ${gh_tgz}\$" checksums.txt | sha256sum -c - )
                tar -xzf "$tmp_dir/$gh_tgz" -C "$tmp_dir"
                install -m 0755 "$tmp_dir/gh_${gh_ver}_linux_amd64/bin/gh" "$GH_DEST"
                "$GH_DEST" --version
                rm -rf "$tmp_dir"
              }

              install_psql() {
                local latest have pg_major
                latest="$(curl -fsSL --retry 3 --retry-delay 2 https://www.postgresql.org/versions.json \
                  | python3 -c 'import sys, json; v = max((x for x in json.load(sys.stdin) if x.get("current")), key=lambda x: float(x["major"])); print(v["major"] + "." + v["latestMinor"])' 2>/dev/null || true)"
                if [ -x /opt/data/pg/bin/psql ]; then
                  have="$(LD_LIBRARY_PATH=/opt/data/pg/lib /opt/data/pg/bin/psql --version 2>/dev/null | awk '{print $3}' || true)"
                  if [ -n "$latest" ] && [ "$have" = "$latest" ]; then
                    echo "psql $have already latest — skipping install"
                    return 0
                  fi
                fi
                pg_major="${latest%%.*}"; [ -n "$pg_major" ] || pg_major=17
                if command -v apt-get >/dev/null 2>&1; then
                  (
                    set -e
                    export DEBIAN_FRONTEND=noninteractive
                    apt-get update -qq
                    apt-get install -y -qq --no-install-recommends curl ca-certificates gnupg lsb-release
                    install -d /usr/share/postgresql-common/pgdg
                    curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
                      -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
                    echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
                      > /etc/apt/sources.list.d/pgdg.list
                    apt-get update -qq
                    apt-get install -y -qq --no-install-recommends "postgresql-client-${pg_major}"
                    mkdir -p /opt/data/pg/bin /opt/data/pg/lib
                    cp -f "/usr/lib/postgresql/${pg_major}/bin/psql" /opt/data/pg/bin/psql
                    ldd "/usr/lib/postgresql/${pg_major}/bin/psql" | awk '/=> \//{print $3}' \
                      | while read -r so; do cp -aL "$so" /opt/data/pg/lib/ 2>/dev/null || true; done
                    LD_LIBRARY_PATH=/opt/data/pg/lib /opt/data/pg/bin/psql --version
                  ) && echo "psql installed" || echo "WARN: psql install failed; continuing without psql"
                else
                  echo "WARN: apt-get unavailable in image; skipping psql install"
                fi
              }

              install_jq() {
                local tag ver have tmp
                tag="$(curl -fsSL --retry 3 --retry-delay 2 https://api.github.com/repos/jqlang/jq/releases/latest \
                  | python3 -c 'import sys, json; print(json.load(sys.stdin)["tag_name"])')"
                ver="${tag#jq-}"
                have="$(/opt/data/bin/jq --version 2>/dev/null | sed 's/^jq-//' || true)"
                if [ "$have" = "$ver" ]; then echo "jq $have already latest — skipping download"; return 0; fi
                tmp="$(mktemp -d)"
                curl -fsSL --retry 3 --retry-delay 2 -o "$tmp/jq-linux-amd64" \
                  "https://github.com/jqlang/jq/releases/download/${tag}/jq-linux-amd64"
                curl -fsSL --retry 3 --retry-delay 2 -o "$tmp/sha256sum.txt" \
                  "https://github.com/jqlang/jq/releases/download/${tag}/sha256sum.txt"
                ( cd "$tmp" && grep " jq-linux-amd64\$" sha256sum.txt | sha256sum -c - )
                install -m 0755 "$tmp/jq-linux-amd64" /opt/data/bin/jq
                /opt/data/bin/jq --version
                rm -rf "$tmp"
              }

              install_yq() {
                local tag have tmp want got
                tag="$(curl -fsSL --retry 3 --retry-delay 2 https://api.github.com/repos/mikefarah/yq/releases/latest \
                  | python3 -c 'import sys, json; print(json.load(sys.stdin)["tag_name"])')"
                have="$(/opt/data/bin/yq --version 2>/dev/null | awk '{print $NF}' || true)"
                if [ "$have" = "$tag" ]; then echo "yq $have already latest — skipping download"; return 0; fi
                tmp="$(mktemp -d)"
                curl -fsSL --retry 3 --retry-delay 2 -o "$tmp/yq_linux_amd64" \
                  "https://github.com/mikefarah/yq/releases/download/${tag}/yq_linux_amd64"
                curl -fsSL --retry 3 --retry-delay 2 -o "$tmp/checksums-bsd" \
                  "https://github.com/mikefarah/yq/releases/download/${tag}/checksums-bsd"
                want="$(grep '^SHA256 (yq_linux_amd64) = ' "$tmp/checksums-bsd" | awk '{print $4}')"
                got="$(sha256sum "$tmp/yq_linux_amd64" | awk '{print $1}')"
                [ -n "$want" ] && [ "$want" = "$got" ] || { echo "yq checksum mismatch" >&2; return 1; }
                install -m 0755 "$tmp/yq_linux_amd64" /opt/data/bin/yq
                /opt/data/bin/yq --version
                rm -rf "$tmp"
              }

              install_kubectl & k_pid=$!
              install_gh      & g_pid=$!
              install_psql    & p_pid=$!
              install_jq      & j_pid=$!
              install_yq      & y_pid=$!
              wait "$k_pid"
              wait "$g_pid"
              wait "$p_pid" || true
              wait "$j_pid" || echo "WARN: jq install failed; continuing"
              wait "$y_pid" || echo "WARN: yq install failed; continuing"

              if [ -x /opt/data/pg/bin/psql ]; then
                printf '#!/bin/sh\nexec env LD_LIBRARY_PATH=/opt/data/pg/lib /opt/data/pg/bin/psql "$@"\n' > /opt/data/bin/psql
                chmod 0755 /opt/data/bin/psql
                echo "psql wrapper installed at /opt/data/bin/psql"
              fi

              chown -R 10000:10000 /opt/data/bin /opt/data/gh 2>/dev/null || true
              chown -R 10000:10000 /opt/data/pg 2>/dev/null || true
          volumeMounts:
            - name: agent-state
              mountPath: /opt/data
              subPath: hermes-data
        - name: install-claude-code
          image: nousresearch/hermes-agent:v2026.9.7@sha256:63bfb6d732f49a55d453e801057273785cc61e0f6ee43db3fa2f2a79846301b7
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              npm install --prefix /cli --omit=dev --ignore-scripts --no-audit --no-fund \
                --cache /tmp/npm @anthropic-ai/claude-code@latest
              node /cli/node_modules/@anthropic-ai/claude-code/install.cjs
              /cli/node_modules/.bin/claude --version
          volumeMounts:
            - name: claude-cli
              mountPath: /cli
            - name: claude-tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
        - name: init-hermes-config
          image: nousresearch/hermes-agent:v2026.9.7@sha256:63bfb6d732f49a55d453e801057273785cc61e0f6ee43db3fa2f2a79846301b7
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          env:
            - name: VERTEX_CLAUDE_BRIDGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-secrets
                  key: VERTEX_CLAUDE_BRIDGE_API_KEY
          envFrom:
            - secretRef:
                name: hermes-agent-secrets
          args:
            - |
              set -eu
              mkdir -p \
                /opt/data \
                /opt/data/image_cache \
                /opt/data/skills \
                /opt/data/memory \
                /opt/data/.hermes/memory
              chmod 0770 /opt/data/image_cache /opt/data/skills /opt/data/memory /opt/data/.hermes/memory
              cp /runtime-identity/SOUL.md /opt/data/SOUL.md
              mkdir -p /opt/data/skills/lead-devops-sre
              if [ ! -f /opt/data/skills/lead-devops-sre/SKILL.md ]; then
                cp /runtime-lead-devops-sre-skill/SKILL.md /opt/data/skills/lead-devops-sre/SKILL.md
              fi
              if [ -f /opt/data/skills/.bundled_manifest ]; then
                while IFS=: read -r bundled _rest; do
                  case "$bundled" in
                    ""|lead-devops-sre) continue ;;
                  esac
                  for d in "/opt/data/skills/$bundled" /opt/data/skills/*/"$bundled"; do
                    [ -d "$d" ] && rm -rf "$d" && echo "removed bundled skill $d"
                  done
                done < /opt/data/skills/.bundled_manifest
              fi
              for d in /opt/data/skills/*/; do
                [ -d "$d" ] && [ -z "$(find "$d" -name SKILL.md -print -quit)" ] && rm -rf "$d" && echo "removed empty skill category $d"
              done
              rm -f /opt/data/.skills_prompt_snapshot.json
              mkdir -p /opt/data/hooks
              cat > /opt/data/hooks/block-installs.py <<'HOOK'
              #!/usr/bin/env python3
              import json, re, sys
              try:
                  payload = json.load(sys.stdin)
              except Exception:
                  sys.exit(2)
              cmd = str((payload.get("tool_input") or {}).get("command", ""))
              PATTERNS = [
                  r"\buv\b", r"\bpip3?\b", r"\bpython3?\s+-m\s+pip\b",
                  r"\bapt(-get|-cache)?\b", r"\bdpkg\b", r"\bapk\b", r"\byum\b", r"\bdnf\b",
                  r"\bnpm\b", r"\bpnpm\b", r"\byarn\b", r"\bnpx\b", r"\bgem\s+install\b",
                  r"\bcargo\s+install\b", r"\bgo\s+install\b", r"\bconda\b", r"\beasy_install\b",
                  r"\b(curl|wget)\b[^|;&]*\|\s*(ba|z|da)?sh\b",
                  r"\bgcloud\b", r"\bgsutil\b",
              ]
              for p in PATTERNS:
                  if re.search(p, cmd, re.IGNORECASE):
                      print(json.dumps({
                          "decision": "block",
                          "reason": "Package installation and pipe-to-shell execution are disabled on this agent. Use only the pre-installed tools (kubectl, gh, psql).",
                      }))
                      break
              HOOK
              chmod 0755 /opt/data/hooks/block-installs.py
              export HERMES_HOME=/opt/data
              /opt/hermes/.venv/bin/hermes skills opt-out --remove --yes 2>&1 | tail -1 || true
              /opt/hermes/.venv/bin/python - <<'PY'
              from pathlib import Path
              import os
              import yaml

              p = Path("/opt/data/config.yaml")
              data = yaml.safe_load(p.read_text()) if p.exists() else {}
              data = data or {}

              data["model"] = {
                  "default": "claude-opus-5",
                  "provider": "claude-code-native",
                  "base_url": "http://127.0.0.1:18184/v1",
                  "api_mode": "chat_completions",
                  "context_length": 1000000,
              }

              providers = data.setdefault("providers", {})
              providers["vertex-claude-bridge"] = {
                  "name": "Vertex Claude Bridge",
                  "base_url": "http://127.0.0.1:18182/v1",
                  "api_key": os.environ["VERTEX_CLAUDE_BRIDGE_API_KEY"],
                  "default_model": "claude-opus-5",
                  "transport": "chat_completions",
              }
              providers["claude-code-native"] = {
                  "name": "Claude Code (native, Vertex AI)",
                  "base_url": "http://127.0.0.1:18184/v1",
                  "api_key": os.environ["VERTEX_CLAUDE_BRIDGE_API_KEY"],
                  "default_model": "claude-opus-5",
                  "transport": "chat_completions",
                  "request_timeout_seconds": 1560,
                  "stale_timeout_seconds": 1560,
              }

              tools = data.setdefault("tools", {})
              tool_search = tools.setdefault("tool_search", {})
              tool_search["enabled"] = "off"
              for _dead in ("threshold_pct", "search_default_limit", "max_search_limit", "listing", "listing_max_tokens"):
                  tool_search.pop(_dead, None)

              # Manage only the integrations shipped with this deployment.
              mcp_servers = {}
              data["mcp_servers"] = mcp_servers
              mcp_servers.update({
                  "gcp-logging-sre-readonly": {
                      "url": "http://127.0.0.1:19190/logging",
                      "tools": {
                          "include": [
                              "list_log_entries",
                              "list_log_names",
                          ],
                      },
                  },
                  "gcp-monitoring-sre-readonly": {
                      "url": "http://127.0.0.1:19190/monitoring",
                      "tools": {
                          "include": [
                              "list_timeseries",
                              "query_range",
                              "get_alert_policy",
                              "list_alert_policies",
                              "get_alert",
                              "list_alerts",
                              "list_metric_descriptors",
                          ],
                      },
                  },
                  "gcp-trace-sre-readonly": {
                      "url": "http://127.0.0.1:19190/trace",
                      "tools": {
                          "include": [
                              "list_traces",
                              "get_trace",
                          ],
                      },
                  },
                  "playwright-browser": {
                      "url": "http://localhost:8931/mcp",
                      "timeout": 120,
                      "connect_timeout": 60,
                      "tools": {
                          "include": [
                              "browser_navigate",
                              "browser_navigate_back",
                              "browser_snapshot",
                              "browser_click",
                              "browser_type",
                              "browser_fill_form",
                              "browser_press_key",
                              "browser_select_option",
                              "browser_console_messages",
                              "browser_network_requests",
                              "browser_take_screenshot",
                              "browser_evaluate",
                              "browser_wait_for",
                              "browser_tabs",
                              "browser_close",
                          ],
                      },
                  },
              })

              compression = data.setdefault("compression", {})
              compression["threshold"] = 0.20
              compression["enabled"] = True
              compression["tail_mode"] = "lean"
              compression["abort_on_summary_failure"] = True
              compression["hygiene_hard_message_limit"] = 5000
              compression["idle_compact_after_seconds"] = 3600
              compression["min_tail_user_messages"] = 3

              tool_output = data.setdefault("tool_output", {})
              tool_output["max_bytes"] = 30000
              tool_output["max_lines"] = 1000
              tool_output["max_line_length"] = 2000
              data["file_read_max_chars"] = 50000
              data["context_file_max_chars"] = 60000

              gw = data.setdefault("gateway", {})
              gw["strict"] = True                      # bare file paths in model output are NOT auto-uploaded to messaging platforms
              gw["max_inbound_media_bytes"] = 26214400 # 25 MiB (default 128 MiB read fully into RAM → OOM risk)
              gw.setdefault("api_server", {})["max_concurrent_runs"] = 2
              gw.setdefault("message_timestamps", {})["enabled"] = True  # incident timelines: model sees when each message was sent
              data.setdefault("skills", {})["write_approval"] = False    # allow persistent agent-authored skills without a pending queue
              data["max_concurrent_sessions"] = 4
              _agent = data.setdefault("agent", {})       # (agent_cfg is defined further down; do not depend on ordering)
              _agent["run_budget_seconds"] = 1800         # wall-clock cap per run; wrap-up notice at 80%
              _agent["restart_drain_timeout"] = 20        # pod terminationGracePeriodSeconds is 30
              _agent["clarify_timeout"] = 3600
              data.setdefault("approvals", {})["timeout"] = 300
              data["approvals"]["single_query_mode"] = "deny"
              _deny = list(data["approvals"].get("deny") or [])
              for _glob in ("gcloud*", "*gcloud*", "*gsutil*", "*bq query*", "*bq ls*", "*bq show*"):
                  if _glob not in _deny:
                      _deny.append(_glob)
              data["approvals"]["deny"] = _deny
              sess = data.setdefault("sessions", {})
              sess["auto_prune"] = True
              sess["retention_days"] = 90
              kanban = data.setdefault("kanban", {})
              kanban["dispatch_in_gateway"] = False
              kanban["auto_decompose"] = False
              kanban["review_dispatch"] = False
              data.setdefault("curator", {})["enabled"] = False   # deterministic-only pass + weekly tarballs; nothing to curate
              for _dead in ("x_search", "updates", "human_delay", "prompt_caching"):
                  data.pop(_dead, None)
              data.setdefault("model_overrides", {}).setdefault("vertex-claude-bridge", {})["claude-opus-5"] = {
                  "context_window": 1000000,
                  "supports_vision": True,
                  "supports_tools": True,
              }
              data["model_overrides"].setdefault("claude-code-native", {})["claude-opus-5"] = {
                  "context_window": 1000000,
                  "supports_vision": False,
                  "supports_tools": True,
              }

              agent_cfg = data.setdefault("agent", {})
              _disabled = set(agent_cfg.get("disabled_toolsets") or [])
              _disabled.add("code_execution")
              _disabled.update({
                  "web",           # web_search/web_extract — no backend configured; egress vector
                  "browser",       # Hermes native browser — Playwright MCP is the sanctioned browser
                  "image_gen",     # image generation — irrelevant, external API
                  "bfl",           # BFL FLUX video — irrelevant, external API
                  "tts",           # text-to-speech — irrelevant in the dashboard
                  "computer_use",  # desktop automation — meaningless in a pod
                  "delegation",    # sub-agent spawning — a token multiplier
                  "cronjob",       # scheduled jobs — not part of this agent's role
              })
              agent_cfg["disabled_toolsets"] = sorted(_disabled)

              _bridge = {
                  "provider": "custom",
                  "base_url": "http://127.0.0.1:18182/v1",
                  "api_key": os.environ["VERTEX_CLAUDE_BRIDGE_API_KEY"],
                  "model": "claude-sonnet-4-6",
              }
              aux = data.setdefault("auxiliary", {})
              for _task in ("background_review", "triage_specifier", "profile_describer", "monitor",
                            "memory_query_rewrite", "approval", "mcp", "skills_hub", "goal_judge",
                            "kanban_decomposer", "review", "title_generation"):
                  aux.setdefault(_task, {}).update(_bridge)
              aux.setdefault("title_generation", {})["enabled"] = False
              aux.setdefault("background_review", {})["enabled"] = False
              aux.setdefault("compression", {})["timeout"] = 360
              aux.pop("web_extract", None)
              _bridge_opus = dict(_bridge, model="claude-opus-5")
              aux.setdefault("vision", {}).update(_bridge_opus)
              aux.setdefault("compression", {}).update(_bridge_opus)

              data.setdefault("model_catalog", {})["enabled"] = False
              data.setdefault("lsp", {})["enabled"] = False

              display = data.setdefault("display", {})
              display["memory_notifications"] = "off"  # no "Memory updated / Self-improvement review" acks
              display["turn_completion_explainer"] = False
              security_cfg = data.setdefault("security", {})
              security_cfg["allow_lazy_installs"] = False

              agent_cfg["max_turns"] = 40
              tlg = data.setdefault("tool_loop_guardrails", {})
              tlg["hard_stop_enabled"] = True
              tlg.setdefault("hard_stop_after", {})
              tlg["hard_stop_after"].update({"exact_failure": 3, "same_tool_failure": 5, "idempotent_no_progress": 3})

              data["hooks"] = {
                  "pre_tool_call": [
                      {"matcher": "terminal", "command": "/opt/data/hooks/block-installs.py", "timeout": 10, "fail_closed": True},
                  ],
              }
              data["hooks_auto_accept"] = True

              p.write_text(yaml.safe_dump(data, sort_keys=False))
              p.chmod(0o600)
              PY
              chown -R 10000:10000 /opt/data
          volumeMounts:
            - name: agent-state
              mountPath: /opt/data
              subPath: hermes-data
            - name: runtime-identity
              mountPath: /runtime-identity
              readOnly: true
            - name: lead-devops-sre-skill
              mountPath: /runtime-lead-devops-sre-skill
              readOnly: true
      containers:
