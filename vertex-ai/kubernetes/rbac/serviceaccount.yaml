# Dedicated identity for the standalone Vertex Hermes deployment.
#
# GKE Workload Identity: this Kubernetes ServiceAccount is bound to a Google
# service account (GSA), so every container in the pod gets keyless, short-lived
# Google credentials from the GKE metadata server via ADC — no JSON key, no
# OAuth refresh-token churn. The vertex-gemini-bridge sidecar picks this up
# automatically through google.auth.default().
#
# One-time IAM setup (full commands in ../README.md → "Workload Identity (Vertex AI)"):
#   1. Pick the GSA the pod acts as (dedicated GSA outside a sandbox; the Compute
#      Engine default SA inside one, where project-level setIamPolicy is denied).
#   2. Grant Vertex AI access:    roles/aiplatform.user on the project — NOT needed
#      for the compute default SA, which already carries roles/editor.
#   3. Bind KSA -> GSA:           roles/iam.workloadIdentityUser for
#                                 serviceAccount:<project>.svc.id.goog[devops-agent/hermes-agent]
#
# Requires Workload Identity on the cluster (--workload-pool=<project>.svc.id.goog),
# which the repo's gcp/ provisioning enables.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-agent
  namespace: devops-agent
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: vertex-runtime
    app.kubernetes.io/part-of: devops-agent
  annotations:
    # __PROJECT_NUMBER__ is substituted at apply time so this manifest stays
    # project-agnostic (sandbox projects are recreated with a new number):
    #   kubectl kustomize ../overlays/sandbox \
    #     | sed "s|__PROJECT_NUMBER__|$PROJECT_NUMBER|g" | kubectl apply -f -
    # Outside a sandbox, replace the whole value with a dedicated least-privilege
    # GSA holding roles/aiplatform.user.
    iam.gke.io/gcp-service-account: __PROJECT_NUMBER__-compute@developer.gserviceaccount.com
