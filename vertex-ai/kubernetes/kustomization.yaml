apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rbac/serviceaccount.yaml
  - workloads/service.yaml
  - workloads/statefulset.yaml
  - workloads/ingressroute.yaml
configMapGenerator:
  - name: hermes-agent-vertex-bridge
    namespace: devops-agent
    files:
      # Both bridges ship in the ConfigMap; the StatefulSet sidecar picks one.
      # Gemini is the deployed default — swapping back to Claude on Vertex is a
      # one-line change to the sidecar command, with no ConfigMap edit.
      - vertex_gemini_bridge.py=bridge/vertex_gemini_bridge.py
      - vertex_claude_bridge.py=bridge/vertex_claude_bridge.py
      - requirements.txt=bridge/requirements.txt
  - name: hermes-agent-gcp-mcp-auth-bridge
    namespace: devops-agent
    files:
      - gcp_mcp_auth_bridge.py=gcp-mcp/gcp_mcp_auth_bridge.py
  - name: hermes-agent-github-cli
    namespace: devops-agent
    files:
      - gh=github-cli/gh
  - name: hermes-agent-runtime-identity
    namespace: devops-agent
    files:
      - SOUL.md=identity/SOUL.md
  - name: hermes-agent-declarative-skills
    namespace: devops-agent
    files:
      - lead-devops-sre.SKILL.md=skills/lead-devops-sre/SKILL.md
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: vertex-bridge
    app.kubernetes.io/part-of: devops-agent
