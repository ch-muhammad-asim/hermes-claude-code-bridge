apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-agent-runtime-env
  namespace: devops-agent
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: runtime
    app.kubernetes.io/part-of: devops-agent
data:
  # Images are consumed by Kustomize replacements at render time.
  INIT_WORKSPACE_IMAGE: busybox:1.36
  OPENCODE_INSTALLER_IMAGE: node:22-bookworm-slim
  KUBECTL_INSTALLER_IMAGE: curlimages/curl:8.11.1
  HERMES_IMAGE: nousresearch/hermes-agent:v2026.7.20

  # Shared paths on the PVC.
  HERMES_HOME: /opt/data
  HERMES_WORKSPACE: /workspace/devops-agent
  HERMES_SKILLS_DIR: /opt/data/skills
  # The real kubectl binary. It is deliberately NOT on PATH — the read-only wrapper at
  # /opt/data/bin/kubectl is, and it execs this one after checking the verb.
  KUBECTL_REAL: /opt/data/kubectl/kubectl
  KUBECTL_WRAPPER: /opt/data/bin/kubectl
  KUBECTL_STABLE_URL: https://dl.k8s.io/release/stable.txt

  # Hermes gateway/dashboard runtime.
  API_SERVER_ENABLED: "true"
  API_SERVER_HOST: "0.0.0.0"
  API_SERVER_PORT: "8642"
  HERMES_DASHBOARD: "1"
  HERMES_DASHBOARD_HOST: "0.0.0.0"
  HERMES_DASHBOARD_PORT: "9119"
  HERMES_DASHBOARD_BASIC_AUTH_TTL_SECONDS: "43200"
  GATEWAY_ALLOW_ALL_USERS: "true"

  # First-run model seed. The provider id is "opencode-bridge", NOT "opencode":
  # Hermes ships a built-in OpenCode Zen provider whose canonical id is "opencode-zen"
  # with "opencode" as an alias, so an unambiguous name keeps resolution off the cloud
  # provider and on this pod's loopback bridge. (Verified with
  # hermes_cli.runtime_provider._get_named_custom_provider.)
  HERMES_DEFAULT_PROVIDER: opencode-bridge
  HERMES_DEFAULT_MODEL: opencode/mimo-v2.5-free
  HERMES_DEFAULT_BASE_URL: http://127.0.0.1:18282/v1
  HERMES_DEFAULT_API_MODE: chat_completions
  # Pinned so compaction math uses the true window: Hermes cannot probe context length
  # from a custom bridge and would otherwise assume a smaller default.
  HERMES_DEFAULT_CONTEXT_LENGTH: "200000"

  PATH: /opt/data/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
