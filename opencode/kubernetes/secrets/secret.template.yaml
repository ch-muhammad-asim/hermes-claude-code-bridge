apiVersion: v1
kind: Secret
metadata:
  name: hermes-agent-secrets
  namespace: devops-agent
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: devops-agent
type: Opaque
# Template only. Do not apply this file as-is and do not commit real secret values here.
# Render it from exported environment variables, for example:
#
#   envsubst < secret.template.yaml | kubectl apply -f -
#
# Required variables:
#   API_SERVER_KEY                             — Hermes API server bearer token
#   HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH  — see ../README.md (generate with the
#                                                exact Hermes image the StatefulSet uses)
#   HERMES_DASHBOARD_BASIC_AUTH_SECRET         — dashboard session-signing secret
#   OPENCODE_BRIDGE_API_KEY                    — shared secret between Hermes and the
#                                                bridge sidecar. The bridge listens on
#                                                loopback only, but requiring a bearer
#                                                means another container in the pod
#                                                cannot drive it anonymously.
#
# Generate the two random values with:
#   API_SERVER_KEY="$(openssl rand -hex 32)"
#   OPENCODE_BRIDGE_API_KEY="$(openssl rand -hex 32)"
stringData:
  API_SERVER_KEY: "${API_SERVER_KEY}"
  HERMES_DASHBOARD_BASIC_AUTH_USERNAME: admin
  HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH: "${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH}"
  HERMES_DASHBOARD_BASIC_AUTH_SECRET: "${HERMES_DASHBOARD_BASIC_AUTH_SECRET}"
  OPENCODE_BRIDGE_API_KEY: "${OPENCODE_BRIDGE_API_KEY}"

  # ── Optional ────────────────────────────────────────────────────────────────
  # OpenCode credentials. NOT required: opencode zen's free models work
  # unauthenticated, which is the whole point of this deployment. Seed a key only to
  # reach your account's other (paid) models, and then also set
  # OPENCODE_BRIDGE_FREE_ONLY=false in configmaps/configmap-opencode-bridge-env.yaml —
  # otherwise the bridge keeps refusing anything that isn't free.
  # OPENCODE_API_KEY: "${OPENCODE_API_KEY}"

  # Vision routing. The free models are text-only; point Hermes' auxiliary Vision task
  # at an image-capable OpenAI-compatible endpoint if you need image analysis.
  # HERMES_VISION_BASE_URL: "https://vision.example.internal/v1"
  # HERMES_VISION_MODEL: "some-vision-model"
  # HERMES_VISION_API_KEY: "${HERMES_VISION_API_KEY}"

  # First-run model seed. Only applied when config.yaml does not exist yet; dashboard
  # changes are preserved across restarts after that.
  HERMES_DEFAULT_PROVIDER: opencode-bridge
  HERMES_DEFAULT_MODEL: opencode/mimo-v2.5-free
  HERMES_DEFAULT_BASE_URL: http://127.0.0.1:18282/v1
  HERMES_DEFAULT_API_MODE: chat_completions

  # Optional: add Hermes provider entries without changing manifests. Removing a
  # provider from this YAML also removes it from config.yaml on the next restart.
  # HERMES_EXTRA_PROVIDERS_YAML: |
  #   custom-llm:
  #     name: Custom LLM
  #     base_url: https://llm.example.internal/v1
  #     api_key: ${CUSTOM_LLM_API_KEY}
  #     default_model: approved-model
  #     transport: chat_completions
