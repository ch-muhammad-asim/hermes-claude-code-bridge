# 🤖 Dedicated identity for the OpenCode agent's read-only DevOps access.
# One ServiceAccount per workload — never the default SA.
#
# The pod runs as this SA (workloads/statefulset.yaml: serviceAccountName: hermes-agent),
# so the in-cluster token every kubectl call uses is automatically scoped to the
# read-only Role/ClusterRole bound below. This is the layer that actually guarantees the
# agent cannot mutate the cluster: the OpenCode permission policy and the kubectl
# wrapper can be widened by a config edit, but the API server will still refuse.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-agent
  namespace: devops-agent
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: devops-rbac
    app.kubernetes.io/part-of: devops-agent
