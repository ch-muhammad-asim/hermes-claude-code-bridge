apiVersion: v1
kind: Service
metadata:
  name: hermes-agent
  namespace: devops-agent
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: devops-agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hermes-agent
  ports:
    - name: api
      port: 8642
      targetPort: api
    - name: dashboard
      port: 9119
      targetPort: dashboard
# The bridge (18282) is deliberately NOT exposed here. It binds 127.0.0.1 inside the
# pod, so only Hermes — sharing the pod's network namespace — can reach it. Nothing
# outside the pod can talk to the OpenCode CLI, even within the cluster.
