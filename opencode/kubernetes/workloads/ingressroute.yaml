apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hermes-agent-dashboard
  namespace: devops-agent
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: devops-agent
spec:
  # Served by the Traefik controller that watches the "traefik-external" IngressClass
  # (chart-pinned install under ../../../kubernetes/traefik/). An ingress.class
  # annotation naming a class no Traefik instance watches is silently never picked up —
  # declare the class in spec and keep it aligned with your Traefik install.
  ingressClassName: traefik-external
  entryPoints:
    - websecure
  tls: {}
  # The Host() value is set once in kustomization.yaml (hermes-params.HERMES_DOMAIN) and
  # fanned out to all three routes by a Kustomize replacement — edit it there, not here.
  routes:
    - match: Host(`opencode.example.com`) && PathPrefix(`/v1`)
      kind: Rule
      services:
        - name: hermes-agent
          namespace: devops-agent
          port: 8642
    - match: Host(`opencode.example.com`) && PathPrefix(`/health`)
      kind: Rule
      services:
        - name: hermes-agent
          namespace: devops-agent
          port: 8642
    - match: Host(`opencode.example.com`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: hermes-agent
          namespace: devops-agent
          port: 9119
