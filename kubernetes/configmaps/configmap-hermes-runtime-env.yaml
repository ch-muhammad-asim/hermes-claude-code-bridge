apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-agent-runtime-env
  namespace: devops-agent
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: runtime
    app.kubernetes.io/part-of: devops-agent
data:
  # Images are consumed by Kustomize replacements at render time.
  INIT_WORKSPACE_IMAGE: busybox:1.36
  CLAUDE_CODE_INSTALLER_IMAGE: node:22-bookworm-slim
  KUBECTL_INSTALLER_IMAGE: curlimages/curl:8.11.1
  HERMES_IMAGE: nousresearch/hermes-agent:v2026.7.20

  # Shared paths.
  HERMES_HOME: /opt/data
  HERMES_WORKSPACE: /workspace/devops-agent
  HERMES_SKILLS_DIR: /opt/data/skills
  KUBECTL_DEST: /opt/data/bin/kubectl
  KUBECTL_STABLE_URL: https://dl.k8s.io/release/stable.txt

  # Hermes gateway/dashboard runtime.
  API_SERVER_ENABLED: "true"
  API_SERVER_HOST: "0.0.0.0"
  API_SERVER_PORT: "8642"
  HERMES_DASHBOARD: "1"
  HERMES_DASHBOARD_HOST: "0.0.0.0"
  HERMES_DASHBOARD_PORT: "9119"
  HERMES_DASHBOARD_BASIC_AUTH_TTL_SECONDS: "43200"
  GATEWAY_ALLOW_ALL_USERS: "true"

  # Production Google Cloud project used by read-only GCP MCP observability tools.
  HERMES_GCP_PROJECT_ID: "your-gcp-project-id"
  GOOGLE_CLOUD_PROJECT: "your-gcp-project-id"
  GCLOUD_PROJECT: "your-gcp-project-id"
  GCP_PROJECT_ID: "your-gcp-project-id"
  GOOGLE_MCP_OAUTH_REDIRECT_PORT: "19191"
  PATH: /opt/data/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
