apiVersion: v1
kind: Secret
metadata:
  name: hermes-agent-google-oauth
  namespace: devops-agent
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: google-oauth
    app.kubernetes.io/part-of: devops-agent
type: Opaque
# Template only. Do not apply this file as-is and do not commit real secret values here.
# Render it from exported environment variables, for example:
#
#   envsubst < secret-google-oauth.template.yaml | kubectl apply -f -
#
# Required variables:
#   GOOGLE_MCP_OAUTH_CLIENT_ID
#   GOOGLE_MCP_OAUTH_CLIENT_SECRET
#   GOOGLE_MCP_OAUTH_REFRESH_TOKEN  (long-lived; obtained once via get-gcp-mcp-refresh-token.py)
stringData:
  GOOGLE_MCP_OAUTH_CLIENT_ID: "${GOOGLE_MCP_OAUTH_CLIENT_ID}"
  GOOGLE_MCP_OAUTH_CLIENT_SECRET: "${GOOGLE_MCP_OAUTH_CLIENT_SECRET}"
  # The offline refresh token the in-pod auth bridge uses to auto-mint access tokens.
  # Without it the proxy stays disabled and GCP MCP access does not work.
  GOOGLE_MCP_OAUTH_REFRESH_TOKEN: "${GOOGLE_MCP_OAUTH_REFRESH_TOKEN}"
