apiVersion: v1
kind: Secret
metadata:
  name: hermes-agent-secrets
  namespace: devops-agent
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: devops-agent
type: Opaque
# Template only. Do not apply this file as-is and do not commit real secret values here.
# Render it from exported environment variables, for example:
#
#   envsubst < secret.template.yaml | kubectl apply -f -
#
# Required variables:
#   API_SERVER_KEY
#   HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH
#   HERMES_DASHBOARD_BASIC_AUTH_SECRET
#   CLAUDE_CODE_PROXY_API_KEY
#
# Generate HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH with the exact Hermes image used by
# the StatefulSet (see README Step 3).
stringData:
  API_SERVER_KEY: "${API_SERVER_KEY}"
  HERMES_DASHBOARD_BASIC_AUTH_USERNAME: admin
  HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH: "${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH}"
  HERMES_DASHBOARD_BASIC_AUTH_SECRET: "${HERMES_DASHBOARD_BASIC_AUTH_SECRET}"
  CLAUDE_CODE_PROXY_API_KEY: "${CLAUDE_CODE_PROXY_API_KEY}"
  # Optional: seed the first-run model only. Dashboard changes are preserved after that.
  HERMES_DEFAULT_PROVIDER: claude-code-bridge
  HERMES_DEFAULT_MODEL: claude-opus-4-8
  HERMES_DEFAULT_BASE_URL: http://127.0.0.1:18181/v1
  HERMES_DEFAULT_API_MODE: chat_completions
  # Optional: add Hermes provider entries without changing manifests.
  # Example:
  # HERMES_EXTRA_PROVIDERS_YAML: |
  #   custom-llm:
  #     name: Custom LLM
  #     base_url: https://llm.example.internal/v1
  #     api_key: ${CUSTOM_LLM_API_KEY}
  #     default_model: approved-model
  #     transport: chat_completions
