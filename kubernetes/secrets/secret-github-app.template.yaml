apiVersion: v1
kind: Secret
metadata:
  name: hermes-agent-github-app
  namespace: devops-agent
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: github-app-credentials
    app.kubernetes.io/part-of: devops-agent
type: Opaque
# Template only. Do not apply this file as-is and never commit a real private key.
stringData:
  app-id: "${GITHUB_APP_ID}"
  installation-id: "${GITHUB_APP_INSTALLATION_ID}"
  private-key.pem: |
    ${GITHUB_APP_PRIVATE_KEY}
