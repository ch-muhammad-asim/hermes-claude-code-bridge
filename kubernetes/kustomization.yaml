apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- configmaps/configmap-claude-bridge-startup.yaml
- configmaps/configmap-claude-bridge-env.yaml
- configmaps/configmap-claude-mcp.yaml
- configmaps/configmap-hermes-runtime-scripts.yaml
- configmaps/configmap-hermes-runtime-env.yaml
- configmaps/configmap-claude-permissions.yaml
- hermes-service-account/01-serviceaccount.yaml
- hermes-service-account/02-role.yaml
- hermes-service-account/03-rolebinding.yaml
- hermes-service-account/04-clusterrole-readonly.yaml
- workloads/service.yaml
- workloads/statefulset.yaml
- workloads/ingressroute.yaml
configMapGenerator:
- name: hermes-agent-claude-bridge
  namespace: devops-agent
  files:
  - claude_code_bridge.py=bridge/claude_code_bridge.py
  - gcp_mcp_auth_bridge.py=bridge/gcp_mcp_auth_bridge.py
- name: hermes-agent-declarative-skills
  namespace: devops-agent
  files:
  - lead-devops-sre.SKILL.md=skills/lead-devops-sre/SKILL.md
# ── Single source of truth for per-deployment values ──────────────────────
# Set these ONCE here; the replacements below fan them out to every manifest
# field that needs them, so `kubectl apply -k .` renders the whole stack.
- name: hermes-params
  namespace: devops-agent
  literals:
  - GCP_PROJECT_ID=playground-s-11-bc37e943
  - HERMES_DOMAIN=hermes.saqlainmushtaq.com
generatorOptions:
  disableNameSuffixHash: true
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: claude-bridge
    app.kubernetes.io/part-of: devops-agent
replacements:
- source:
    kind: ConfigMap
    name: hermes-agent-runtime-env
    fieldPath: data.INIT_WORKSPACE_IMAGE
  targets:
  - select:
      kind: StatefulSet
      name: hermes-agent
    fieldPaths:
    - spec.template.spec.initContainers.[name=init-workspace].image
- source:
    kind: ConfigMap
    name: hermes-agent-runtime-env
    fieldPath: data.CLAUDE_CODE_INSTALLER_IMAGE
  targets:
  - select:
      kind: StatefulSet
      name: hermes-agent
    fieldPaths:
    - spec.template.spec.initContainers.[name=init-claude-code].image
- source:
    kind: ConfigMap
    name: hermes-agent-runtime-env
    fieldPath: data.KUBECTL_INSTALLER_IMAGE
  targets:
  - select:
      kind: StatefulSet
      name: hermes-agent
    fieldPaths:
    - spec.template.spec.initContainers.[name=init-kubectl].image
- source:
    kind: ConfigMap
    name: hermes-agent-runtime-env
    fieldPath: data.HERMES_IMAGE
  targets:
  - select:
      kind: StatefulSet
      name: hermes-agent
    fieldPaths:
    - spec.template.spec.initContainers.[name=init-hermes-config].image
    - spec.template.spec.containers.[name=hermes].image
- source:
    kind: ConfigMap
    name: hermes-agent-claude-bridge-env
    fieldPath: data.CLAUDE_BRIDGE_IMAGE
  targets:
  - select:
      kind: StatefulSet
      name: hermes-agent
    fieldPaths:
    - spec.template.spec.containers.[name=claude-bridge].image
- source:
    kind: ConfigMap
    name: hermes-agent-claude-bridge-env
    fieldPath: data.CLAUDE_BRIDGE_IMAGE_PULL_POLICY
  targets:
  - select:
      kind: StatefulSet
      name: hermes-agent
    fieldPaths:
    - spec.template.spec.containers.[name=claude-bridge].imagePullPolicy
# ── GCP project ID: set once in hermes-params, fan out to every env var ────
- source:
    kind: ConfigMap
    name: hermes-params
    fieldPath: data.GCP_PROJECT_ID
  targets:
  - select:
      kind: ConfigMap
      name: hermes-agent-runtime-env
    fieldPaths:
    - data.HERMES_GCP_PROJECT_ID
    - data.GOOGLE_CLOUD_PROJECT
    - data.GCLOUD_PROJECT
    - data.GCP_PROJECT_ID
  - select:
      kind: ConfigMap
      name: hermes-agent-claude-bridge-env
    fieldPaths:
    - data.HERMES_GCP_PROJECT_ID
    - data.GOOGLE_CLOUD_PROJECT
    - data.GCLOUD_PROJECT
    - data.GCP_PROJECT_ID
# ── Domain: set once, fan out to every Traefik Host() route ───────────────
- source:
    kind: ConfigMap
    name: hermes-params
    fieldPath: data.HERMES_DOMAIN
  targets:
  - select:
      kind: IngressRoute
      name: hermes-agent-dashboard
    fieldPaths:
    - spec.routes.0.match
    - spec.routes.1.match
    - spec.routes.2.match
    options:
      delimiter: "`"
      index: 1
