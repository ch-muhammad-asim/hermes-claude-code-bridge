# 🤖 Dedicated identity for Hermes' read-only DevOps access.
# One ServiceAccount per workload — never the default SA (best practice).
# The pod already runs as this SA (see ../statefulset.yaml: serviceAccountName: hermes-agent),
# so binding read-only RBAC to it scopes EVERY kubectl call the agent makes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-agent
  namespace: devops-agent
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: devops-rbac
    app.kubernetes.io/part-of: devops-agent
