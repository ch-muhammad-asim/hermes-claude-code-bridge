apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Self-contained deploy root: `kubectl apply -k .` renders and applies the stack.
# `secrets/secret.template.yaml` is intentionally NOT a resource here — it holds
# `${...}` placeholders and must be rendered with envsubst first (see its header).
namespace: omniroute

resources:
  - namespace.yaml
  # ── OmniRoute: the multi-provider gateway (ClusterIP only — NOT exposed) ────
  # No IngressRoute on purpose: reach its dashboard with a port-forward instead.
  #   kubectl -n omniroute port-forward svc/omniroute 20128:20128
  - workloads/service.yaml
  - workloads/statefulset.yaml
  # ── Hermes: the agent, using OmniRoute as its model backend ────────────────
  - configmaps/configmap-hermes-config.yaml
  - workloads/hermes-service.yaml
  - workloads/hermes-statefulset.yaml
  - workloads/hermes-ingressroute.yaml   # the only public surface

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: omniroute
      app.kubernetes.io/managed-by: kustomize
