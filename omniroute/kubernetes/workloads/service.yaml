# Headless-capable ClusterIP for the StatefulSet. Cluster-internal clients reach
# the OpenAI-compatible API at:  http://omniroute.omniroute.svc.cluster.local:20128/v1
apiVersion: v1
kind: Service
metadata:
  name: omniroute
  labels:
    app.kubernetes.io/name: omniroute
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: omniroute
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: omniroute
  ports:
    - name: http
      port: 20128
      targetPort: http
