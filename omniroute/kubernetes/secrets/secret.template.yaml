# Template only — DO NOT `kubectl apply -f` this file directly and never commit
# real values. Kubernetes would happily store the literal `${...}` strings and
# the pod would fail auth in confusing ways.
#
# Render it after exporting the variables:
#
#   export JWT_SECRET="$(openssl rand -base64 48)"
#   export API_KEY_SECRET="$(openssl rand -hex 32)"
#   export INITIAL_PASSWORD='<strong password you store in a password manager>'
#   envsubst < secrets/secret.template.yaml | kubectl -n omniroute apply -f -
#
# It is deliberately excluded from kustomization.yaml so `kubectl apply -k .`
# cannot pull placeholders into the cluster.
apiVersion: v1
kind: Secret
metadata:
  name: omniroute-secrets
  labels:
    app.kubernetes.io/name: omniroute
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: omniroute
type: Opaque
stringData:
  # ── Required ────────────────────────────────────────────────────────────────
  # Signs dashboard session cookies.      openssl rand -base64 48
  JWT_SECRET: "${JWT_SECRET}"
  # Encrypts provider API keys at rest.   openssl rand -hex 32
  API_KEY_SECRET: "${API_KEY_SECRET}"
  # First-boot dashboard password; hashed to bcrypt on startup and changeable
  # afterwards from Dashboard → Settings → Security.
  INITIAL_PASSWORD: "${INITIAL_PASSWORD}"

  # ── Optional ────────────────────────────────────────────────────────────────
  # Encrypts the entire SQLite database at rest.  openssl rand -hex 32
  # ⚠️ Back this up: without it an existing database cannot be opened again.
  # STORAGE_ENCRYPTION_KEY: "${STORAGE_ENCRYPTION_KEY}"

  # Shared secret for the WebSocket bridge — set it for any non-local deployment.
  # OMNIROUTE_WS_BRIDGE_SECRET: "${OMNIROUTE_WS_BRIDGE_SECRET}"

  # Shared rate-limit state. Unset ⇒ in-memory rate limiting (fine for one replica).
  # REDIS_URL: "redis://redis.omniroute.svc.cluster.local:6379"
