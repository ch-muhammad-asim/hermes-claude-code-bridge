# Template only — DO NOT `kubectl apply -f` this directly and never commit real values.
# Excluded from kustomization.yaml so placeholders can't reach the cluster.
#
#   export API_SERVER_KEY="$(openssl rand -hex 32)"
#   export HERMES_DASHBOARD_BASIC_AUTH_SECRET="$(openssl rand -hex 32)"
#   export HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH='<scrypt hash — see below>'
#   export OMNIROUTE_CLIENT_API_KEY='<key minted in the OmniRoute dashboard>'
#   envsubst < secrets/hermes-secret.template.yaml | kubectl -n omniroute apply -f -
#
# The dashboard hash must come from Hermes' OWN hash_password() in the same image the
# StatefulSet runs — Hermes uses scrypt, so a generic bcrypt/sha256 hash applies fine
# and then silently rejects every login. `--entrypoint` is required or the image's
# s6-overlay init boots the supervisor and pollutes stdout:
#
#   export HERMES_DASHBOARD_PASSWORD='<your password>'
#   export HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH="$(
#     docker run --rm --entrypoint /opt/hermes/.venv/bin/python \
#       -e PYTHONPATH=/opt/hermes -e HERMES_DASHBOARD_PASSWORD="$HERMES_DASHBOARD_PASSWORD" \
#       nousresearch/hermes-agent:v2026.7.20 \
#       -c 'import os; from plugins.dashboard_auth.basic import hash_password; print(hash_password(os.environ["HERMES_DASHBOARD_PASSWORD"]))')"
#   # -> scrypt$16384$8$1$...
apiVersion: v1
kind: Secret
metadata:
  name: hermes-secrets
  labels:
    app.kubernetes.io/name: hermes
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: omniroute
type: Opaque
stringData:
  # Bearer token for Hermes' own API server (:8642).
  API_SERVER_KEY: "${API_SERVER_KEY}"

  # Hermes dashboard login (:9119).
  HERMES_DASHBOARD_BASIC_AUTH_USERNAME: admin
  HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH: "${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH}"
  HERMES_DASHBOARD_BASIC_AUTH_SECRET: "${HERMES_DASHBOARD_BASIC_AUTH_SECRET}"

  # Client key Hermes presents to OmniRoute. REQUIRED: OmniRoute runs with
  # REQUIRE_API_KEY=true here, so an empty value makes every model call 401.
  # Mint it in the OmniRoute dashboard → Settings → API Keys.
  OMNIROUTE_CLIENT_API_KEY: "${OMNIROUTE_CLIENT_API_KEY}"
