# Dedicated identity for the standalone Bedrock Hermes deployment.
#
# EKS Pod Identity: unlike GKE Workload Identity (and unlike IRSA), the binding
# lives entirely on the AWS side - an EKS PodIdentityAssociation object maps
# devops-agent/hermes-agent to an IAM role. So this ServiceAccount needs NO
# annotation at all: no eks.amazonaws.com/role-arn, no OIDC audience. Every
# container in the pod gets keyless, short-lived AWS credentials from the Pod
# Identity Agent through the SDK's default credential chain, and boto3 in the
# bedrock-claude-bridge sidecar picks them up automatically.
#
# One-time IAM setup is Terragrunt, not kubectl (full commands in ../README.md ->
# "Bedrock access (EKS Pod Identity)"):
#
#   terragrunt apply --working-dir hermes-eks-bedrock-iam
#
# which creates the role, the invoke-only Bedrock policy, and the association for
# exactly this namespace/ServiceAccount pair. If you rename either, update
# aws/terragrunt/env/dev/region/us-east-1/hermes-eks-bedrock-iam/terragrunt.hcl to
# match or the bridge fails with AccessDeniedException on InvokeModel.
#
# Requires the eks-pod-identity-agent add-on, which the repo's modules/eks installs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-agent
  namespace: devops-agent
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: bedrock-runtime
    app.kubernetes.io/part-of: devops-agent
