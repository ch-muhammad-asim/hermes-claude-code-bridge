# 🔗 Binds the scoped remediation ClusterRole into ONE namespace.
#
# A RoleBinding referencing a ClusterRole grants that ClusterRole's rules only inside
# this namespace. That is the whole point: `hermes-sre-remediation` is defined once,
# and every namespace Hermes may repair opts in explicitly here.
#
# `demo` is the namespace the SRE demo breaks on purpose (../../sre-demo). Add another
# namespace by copying this file and changing metadata.namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-sre-remediation
  namespace: demo
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: sre-remediation
    app.kubernetes.io/part-of: devops-agent
subjects:
  - kind: ServiceAccount
    name: hermes-agent
    namespace: devops-agent
roleRef:
  kind: ClusterRole
  name: hermes-sre-remediation
  apiGroup: rbac.authorization.k8s.io
