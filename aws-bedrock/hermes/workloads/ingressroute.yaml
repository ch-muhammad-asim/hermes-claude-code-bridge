apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hermes-agent-dashboard
  namespace: devops-agent
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: devops-agent
spec:
  # Served by the Traefik controller that watches the "traefik-external" IngressClass
  # (chart-pinned install under aws/kubernetes/traefik/, fronted by an NLB from the
  # AWS Load Balancer Controller). An ingress.class annotation naming a class no
  # Traefik instance watches is silently never picked up - declare the class in spec
  # and keep it aligned with your Traefik install.
  ingressClassName: traefik-external
  entryPoints:
    - websecure
  tls: {}
  routes:
    # Most specific first: Traefik sorts by rule priority (rule length), but making
    # the ordering explicit keeps /v1 and /health on the API port rather than having
    # the catch-all swallow them.
    - match: Host(`hermes.saqlainmushtaq.com`) && PathPrefix(`/v1`)
      kind: Rule
      services:
        - name: hermes-agent
          namespace: devops-agent
          port: 8642
    - match: Host(`hermes.saqlainmushtaq.com`) && PathPrefix(`/health`)
      kind: Rule
      services:
        - name: hermes-agent
          namespace: devops-agent
          port: 8642
    - match: Host(`hermes.saqlainmushtaq.com`) && PathPrefix(`/`)
      kind: Rule
      services:
        - name: hermes-agent
          namespace: devops-agent
          port: 9119
