# Traefik Helm values for the single-node k3s cluster (modules/hermes-k3s).
# Derived from ../../aws/kubernetes/traefik/eks-values.yaml - same chart version,
# same entrypoints, same traefik-external IngressClass; only the Service and
# scheduling differ. See the k3s specifics block below.
# Chart: traefik/traefik v41.3.0 (see ./README.md; keep this in sync with CHART_VERSION)

deployment:
  kind: Deployment
  replicas: 1
  podAnnotations:
    prometheus.io/port: "9100"
    prometheus.io/scrape: "true"
  podLabels:
    eks: traefik

# Keep Traefik off Karpenter-managed capacity: it is the ingress path, and a
# consolidation event should never be able to drain the whole data plane
# entrance at once.

ingressClass:
  enabled: true
  isDefaultClass: false
  name: traefik-external

ingressRoute:
  dashboard:
    enabled: false

api:
  dashboard: true
  insecure: false

global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

accessLog:
  enabled: true
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop

metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: false
    addServicesLabels: false

providers:
  kubernetesCRD:
    enabled: true
    ingressClass: traefik-external
  kubernetesIngress:
    enabled: true
    ingressClass: traefik-external

###############################################################################
# k3s specifics - this is what differs from the EKS values
#
# There is no AWS Load Balancer Controller here, so the NLB annotations are gone.
# k3s's built-in servicelb (klipper) fulfils `type: LoadBalancer` on a cluster with
# no cloud controller by binding the port on the host, so the node's public IP
# serves 80/443 directly. That is why the k3s install left servicelb enabled and
# disabled only the packaged Traefik v2.
###############################################################################
service:
  enabled: true
  type: LoadBalancer

ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
    protocol: TCP
  websecure:
    port: 8443
    expose:
      default: true
    exposedPort: 443
    protocol: TCP
    # In chart v41 the entrypoint TLS switch lives under http.tls, not directly
    # on the port. The chart's values schema rejects the old placement.
    http:
      tls:
        enabled: true
  # The traefik entrypoint serves /ping, which is what the NLB health check
  # targets. It is enabled by the chart and must not be exposed publicly.
  traefik:
    port: 9000
    expose:
      default: false
  metrics:
    port: 9100
    expose:
      default: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

# Single replica on a single node: a PDB would only block eviction of the only pod.
podDisruptionBudget:
  enabled: false
